<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stats SVG Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 40px 24px;
      background: #f0f0f0;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      color: #555;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cards {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .card label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #777;
    }

    .preview-dark {
      background: #e4e4e4;
      padding: 16px;
      border-radius: 12px;
    }

    .preview-light {
      background: #e4e4e4;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 0 0 1px #e0e0e0;
    }

    img {
      display: block;
    }

    hr {
      width: 100%;
      max-width: 600px;
      border: none;
      border-top: 1px solid #ddd;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    button {
      font-family: 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: #0d1117;
      color: #fff;
      cursor: pointer;
    }

    button:hover { background: #333; }

    .hint {
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <h1>Case 1 — 0 commits, 0 languages</h1>
  <div class="cards">
    <div class="card"><label>Dark</label><div class="preview-dark"><img id="stats-c1-dark-img"  src="stats-c1-dark.svg"  alt="" /></div></div>
    <div class="card"><label>Light</label><div class="preview-light"><img id="stats-c1-light-img" src="stats-c1-light.svg" alt="" /></div></div>
  </div>

  <hr />

  <h1>Case 2 — 16 commits, 4 languages</h1>
  <div class="cards">
    <div class="card"><label>Dark</label><div class="preview-dark"><img id="stats-c2-dark-img"  src="stats-c2-dark.svg"  alt="" /></div></div>
    <div class="card"><label>Light</label><div class="preview-light"><img id="stats-c2-light-img" src="stats-c2-light.svg" alt="" /></div></div>
  </div>

  <hr />

  <h1>Case 3 — 1337 commits, 16 languages (9 shown)</h1>
  <div class="cards">
    <div class="card"><label>Dark</label><div class="preview-dark"><img id="stats-c3-dark-img"  src="stats-c3-dark.svg"  alt="" /></div></div>
    <div class="card"><label>Light</label><div class="preview-light"><img id="stats-c3-light-img" src="stats-c3-light.svg" alt="" /></div></div>
  </div>

  <hr />

  <h1>Avatar Sheet</h1>

  <div class="cards">
    <div class="card">
      <label>Dark</label>
      <div class="preview-dark">
        <img id="avatars-dark-img" src="avatars-dark.svg" alt="Avatars Dark" />
      </div>
    </div>
    <div class="card">
      <label>Light</label>
      <div class="preview-light">
        <img id="avatars-light-img" src="avatars-light.svg" alt="Avatars Light" />
      </div>
    </div>
  </div>

  <hr />

  <h1>All 100 Avatars</h1>

  <div class="cards">
    <div class="card">
      <label>Dark</label>
      <div class="preview-dark">
        <img id="all-dark-img" src="all-dark.svg" alt="All Dark" />
      </div>
    </div>
    <div class="card">
      <label>Light</label>
      <div class="preview-light">
        <img id="all-light-img" src="all-light.svg" alt="All Light" />
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="refresh()">Refresh</button>
    <span class="hint">Run <code>node preview.js</code> then click Refresh</span>
  </div>

  <script>
    function refresh() {
      const ts = Date.now();
      ['c1','c2','c3'].forEach(c => {
        ['dark','light'].forEach(t => {
          document.getElementById(`stats-${c}-${t}-img`).src = `stats-${c}-${t}.svg?v=` + ts;
        });
      });
      document.getElementById('avatars-dark-img').src  = 'avatars-dark.svg?v='  + ts;
      document.getElementById('avatars-light-img').src = 'avatars-light.svg?v=' + ts;
      document.getElementById('all-dark-img').src      = 'all-dark.svg?v='      + ts;
      document.getElementById('all-light-img').src     = 'all-light.svg?v='     + ts;
    }
  </script>

</body>
</html>
